[project]
name = "jira-tools"
version = "0.1.0"
description = "Jira issues from the command line: filing them, with where they were raised, and reading, editing, starting, moving, assigning, linking, watching, attaching files to, logging time on, commenting on and marking them ready."
requires-python = ">=3.13"
dependencies = ["cli-kit"]

[project.scripts]
jira = "jira_tools.__main__:main"

[tool.uv.sources]
cli-kit = { git = "https://github.com/ianflanagan1/cli-kit", branch = "main" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jira_tools"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
