version: '3'

tasks:
  setup:
    desc: Build .venv and link the commands onto your PATH
    cmds:
      - uv sync
      - .venv/bin/python -m cli_kit.link .

  test:
    desc: Run the tests
    cmds:
      - uv run pytest --quiet

  lint:
    desc: Lint, and check formatting
    cmds:
      - uv run ruff check
      - uv run ruff format --check
